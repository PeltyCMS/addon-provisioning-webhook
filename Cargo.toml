[package]
name = "pelty-addon-provisioning-webhook"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Export the addon ABI (off when another crate reuses this one).
default = ["export"]
export = []

[dependencies]
pelty-addon-sdk = { workspace = true, features = ["provisioning"] }
pelty-provisioning = { path = "../../../crates/pelty-provisioning" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
md-5 = "0.10"
url = "2"
form_urlencoded = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
axum = { version = "0.8", features = ["macros"] }
